name: rich_multimedia
description: A model-agnostic carousel and full-screen viewer for mixed media — images, videos, audio, and PDFs — with screenshot protection and a built-in download flow.
version: 0.1.1
homepage: https://www.azarrapps.com/our-products/rich-multimedia
repository: https://github.com/azarr-technologies/rich_multimedia

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: '>=3.3.0 <4.0.0'
  crypto: '>=3.0.3 <4.0.0'
  dio: '>=5.4.0 <6.0.0'
  fluttertoast: '>=8.2.4 <9.0.0'
  flutter_pdfview: '>=1.3.2 <2.0.0'
  gal: '>=2.3.0 <3.0.0'
  http: '>=1.1.0 <2.0.0'
  just_audio: '>=0.9.36 <0.10.0'
  no_screenshot: '>=2.0.0 <3.0.0'
  open_filex: '>=4.4.0 <5.0.0'
  path_provider: '>=2.1.0 <3.0.0'
  shimmer: '>=3.0.0 <4.0.0'
  video_player: '>=2.8.0 <3.0.0'
  visibility_detector: '>=0.4.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <5.0.0'

flutter:
